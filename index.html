<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NIKE Winter Challenge 2026</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:
linear-gradient(180deg,#9d0000,#cc0000);
color:white;
min-height:100vh;
}

header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
background:#7b0000;
box-shadow:0 0 15px rgba(0,0,0,.3);
}

.logo{
font-size:32px;
font-weight:bold;
}

.store{
font-size:18px;
opacity:.9;
}

.container{
padding:20px;
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.card{
background:white;
color:black;
border-radius:15px;
padding:20px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

.card h2{
margin-bottom:15px;
}

.calendar{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:10px;
}

.day{
height:80px;
border-radius:12px;
background:#f4f4f4;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

.day:hover{
transform:scale(1.05);
background:#d10000;
color:white;
}

.team{
display:flex;
justify-content:space-between;
padding:10px;
margin-bottom:10px;
background:#f0f0f0;
border-radius:10px;
}

.rank{
font-size:20px;
font-weight:bold;
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:none;
align-items:center;
justify-content:center;
}

.popup-content{
background:white;
color:black;
padding:30px;
border-radius:20px;
width:400px;
max-width:90%;
}

button{
background:#d10000;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#900;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<div>

<div class="logo">
🏆 WINTER CHALLENGE 2026
</div>

<div class="store">
NIKE TALANGE 555
</div>

</div>

<button onclick="openAdmin()">
Admin
</button>

</header>

<div class="container">

<div class="card">

<h2>🎄 Calendrier de l'avant</h2>

<div class="calendar" id="calendar">

</div>

</div>

<div>

<div class="card">

<h2>🥇 Classement Equipes</h2>

<div id="teams"></div>

</div>

<br>

<div class="card">

<h2>🏅 Top vendeurs</h2>

<div id="players"></div>

</div>

</div>

</div>

<div class="popup" id="popup">

<div class="popup-content">

<h2 id="popupTitle"></h2>

<p id="popupMission"></p>

<br>

<button onclick="closePopup()">
Fermer
</button>

</div>

</div>

<script>

const APP = {

teams:[
{
name:"Team Lola",
captain:"Lola",
score:0
},
{
name:"Team Yasmine",
captain:"Yasmine",
score:0
},
{
name:"Team Elisa",
captain:"Elisa",
score:0
}
],

players:[

{name:"Lucas",team:"Team Lola",points:0},

{name:"Jade",team:"Team Yasmine",points:0},

{name:"Paul",team:"Team Elisa",points:0}

],

missions:[

"Commande Nike.com x2",
"UPT 3 obligatoire",
"Membership 20%",
"Mission Surprise",
"Plus grosse commande",
"30 memberships",
"Commande +150€",

"Mission 8",
"Mission 9",
"Mission 10",
"Mission 11",
"Mission 12",
"Mission 13",
"Mission 14",
"Mission 15",
"Mission 16",
"Mission 17",
"Mission 18",
"Mission 19",
"Mission 20",
"Mission 21",
"Mission 22",
"Mission 23",
"Mission 24"

]

};

function save(){

localStorage.setItem(
"winterChallenge2026",
JSON.stringify(APP)
);

}

function load(){

let saved =
localStorage.getItem(
"winterChallenge2026"
);

if(saved){

Object.assign(
APP,
JSON.parse(saved)
);

}

}

function buildCalendar(){

const calendar =
document.getElementById("calendar");

calendar.innerHTML="";

APP.missions.forEach((mission,index)=>{

const day =
document.createElement("div");

day.className="day";

day.innerHTML=
(index+1);

day.onclick=()=>{

document.getElementById(
"popupTitle"
).innerText=
"Jour "+(index+1);

document.getElementById(
"popupMission"
).innerText=
mission;

document.getElementById(
"popup"
).style.display=
"flex";

};

calendar.appendChild(day);

});

}

function renderTeams(){

const zone =
document.getElementById("teams");

zone.innerHTML="";

APP.teams
.sort((a,b)=>b.score-a.score)
.forEach((team,index)=>{

zone.innerHTML+=`

<div class="team">

<div>

${index+1}. ${team.name}

</div>

<div>

${team.score} pts

</div>

</div>

`;

});

}

function renderPlayers(){

const zone =
document.getElementById("players");

zone.innerHTML="";

APP.players
.sort((a,b)=>b.points-a.points)
.forEach(player=>{

zone.innerHTML+=`

<div class="team">

<div>${player.name}</div>

<div>${player.points} pts</div>

</div>

`;

});

}

  <div class="popup" id="adminPanel">

<div class="popup-content" style="width:700px;max-width:95%;">

<h2>⚙️ Administration</h2>

<br>

<h3>Créer une équipe</h3>

<input
type="text"
id="newTeamName"
placeholder="Nom équipe">

<input
type="text"
id="newCaptain"
placeholder="Capitaine">

<br><br>

<button onclick="addTeam()">
Créer équipe
</button>

<hr><br>

<h3>Ajouter un vendeur</h3>

<input
type="text"
id="playerName"
placeholder="Nom vendeur">

<select id="teamSelect">
</select>

<br><br>

<button onclick="addPlayer()">
Ajouter vendeur
</button>

<hr><br>

<h3>Points rapides</h3>

<select id="pointsPlayer">
</select>

<input
type="number"
id="pointsValue"
value="10">

<button onclick="addCustomPoints()">
Ajouter points
</button>

<hr><br>

<button onclick="closeAdmin()">
Fermer
</button>

</div>

</div>
  
function openAdmin(){

const password =
prompt("Mot de passe Admin");

if(password !== "123456"){

alert("Accès refusé");
return;

}

document
.getElementById("adminPanel")
.style.display="flex";

}

function closePopup(){

document.getElementById(
"popup"
).style.display=
"none";

}

load();

buildCalendar();

renderTeams();

renderPlayers();

</script>

</body>
</html>
