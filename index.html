<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winter Challenge V3 - Dashboard & Equipes</title><style>body{margin:0;font-family:Segoe UI,Arial;background:#f6f2ea;color:#222}header{background:linear-gradient(135deg,#c8102e,#1f7a45);color:#fff;padding:24px;text-align:center}nav{display:flex;gap:10px;justify-content:center;margin-top:10px}nav button{padding:10px 16px;border:none;border-radius:10px}section{padding:20px}.hidden{display:none}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.1)}.team{padding:10px;margin:8px 0;border-radius:10px}.r{background:#ffe3e3}.g{background:#e3f6e8}.b{background:#e5edff}input,select{padding:8px;margin:4px;width:100%}button.action{background:#c8102e;color:#fff;border:none;padding:8px 12px;border-radius:8px;margin:2px}.members li{margin:4px 0}</style></head><body><header><h1>🎄 Winter Challenge 2026</h1><div id="subtitle"></div><nav><button onclick="showPage('dashboard')">Dashboard</button><button onclick="showPage('teams')">Équipes</button></nav></header><section id="dashboard"><div class="grid"><div class="card"><h2>🏆 Classement Équipes</h2><div class="team r"><span id="t1n"></span> : <b id="t1s">0</b> pts</div><div class="team g"><span id="t2n"></span> : <b id="t2s">0</b> pts</div><div class="team b"><span id="t3n"></span> : <b id="t3s">0</b> pts</div></div><div class="card"><h2>⚙️ Attribution points</h2><select id="teamSelect"></select><button class="action" onclick="addPts(1)">+1 Member</button><button class="action" onclick="addPts(10)">+10 Nike.com</button><button class="action" onclick="addPts(20)">+20 Bonus</button><p id="msg"></p></div></div></section><section id="teams" class="hidden"><div class="card"><h2>👥 Gestion des équipes</h2><h3>Nom des équipes</h3><input id="n1"><input id="n2"><input id="n3"><button class="action" onclick="saveTeams()">Enregistrer</button><hr><h3>Membres</h3><select id="memberTeam"></select><input id="memberName" placeholder="Nom collaborateur"><button class="action" onclick="addMember()">Ajouter</button><div id="lists"></div></div></section><script>let teams=JSON.parse(localStorage.getItem('wc_teams'))||['Team Lola','Team Yasmine','Team Elisa'];let scores=JSON.parse(localStorage.getItem('wc_scores'))||[0,0,0];let members=JSON.parse(localStorage.getItem('wc_members'))||[[],[],[]];function showPage(id){dashboard.classList.add('hidden');teams.classList.add('hidden');document.getElementById(id).classList.remove('hidden')}function render(){subtitle.innerText=teams.join(' • ');n1.value=teams[0];n2.value=teams[1];n3.value=teams[2];t1n.innerText=teams[0];t2n.innerText=teams[1];t3n.innerText=teams[2];t1s.innerText=scores[0];t2s.innerText=scores[1];t3s.innerText=scores[2];teamSelect.innerHTML='';memberTeam.innerHTML='';teams.forEach((t,i)=>{teamSelect.innerHTML+=`<option value="${i}">${t}</option>`;memberTeam.innerHTML+=`<option value="${i}">${t}</option>`});let html='';teams.forEach((t,i)=>{html+=`<div class="team"><h4>${t} (${members[i].length})</h4><ul class="members">`;members[i].forEach((m,j)=>html+=`<li>${m} <button onclick="removeMember(${i},${j})">❌</button></li>`);html+='</ul></div>';});lists.innerHTML=html;}function saveTeams(){teams=[n1.value,n2.value,n3.value];localStorage.setItem('wc_teams',JSON.stringify(teams));render()}function addPts(p){let i=parseInt(teamSelect.value);scores[i]+=p;localStorage.setItem('wc_scores',JSON.stringify(scores));msg.innerText='✅ +'+p+' pts pour '+teams[i];render()}function addMember(){let i=parseInt(memberTeam.value);let n=memberName.value.trim();if(!n)return;members[i].push(n);memberName.value='';localStorage.setItem('wc_members',JSON.stringify(members));render()}function removeMember(i,j){members[i].splice(j,1);localStorage.setItem('wc_members',JSON.stringify(members));render()}render();</script></body></html>
